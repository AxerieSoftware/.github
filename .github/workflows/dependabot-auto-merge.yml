# Merges Dependabot's patch and minor bumps once the PR's other checks pass. Major bumps stay open
# for review. Private repos on the Free plan can't have branch protection, so GitHub won't hold a
# merge for CI on its own; this waits for the other checks itself.
#
# Call it from every repo. The read permissions matter in private repos: without them the token
# can't see the PR's checks.
#
#   name: Dependabot auto-merge
#   on: pull_request
#   permissions:
#     contents: write
#     pull-requests: write
#     checks: read
#     statuses: read
#     actions: read
#   jobs:
#     auto-merge:
#       uses: AxerieSoftware/.github/.github/workflows/dependabot-auto-merge.yml@main
name: Dependabot auto-merge

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Read the update type
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Wait for the other checks, then merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF: /actions/runs/${{ github.run_id }}/
        run: |
          set -euo pipefail
          # This run's own check links to this run; every other check is one to wait for.
          others='[.[] | select(.link // "" | contains(env.SELF) | not)]'
          # gh exits 8 while checks are pending; any other failure stops the job instead of waiting forever.
          count() { gh pr checks "$PR_URL" --json link,bucket --jq "$others | map(select($1)) | length" || [ $? = 8 ]; }

          # Give the other workflows a moment to register their checks.
          sleep 30
          while pending=$(count '.bucket == "pending"') && [ "$pending" != 0 ]; do
            sleep 30
          done
          [ "$pending" = 0 ]

          failed=$(count '.bucket == "fail" or .bucket == "cancel"')
          if [ "$failed" != 0 ]; then
            echo "Other checks failed; leaving the PR open."
            exit 1
          fi
          gh pr merge --squash "$PR_URL"
